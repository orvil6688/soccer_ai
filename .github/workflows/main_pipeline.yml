name: main_pipeline

# 架構 A（OddsPapi）：historical 為賽前即時走勢。
# 角色＝**每日篩選**（轉向後，見 docs/on_demand_proposal.md）：每天一次全 select 產候選清單
#   （哪些場有 edge），給總司令早上看、決定盯哪場。**候選清單會變、僅方向參考**；選中的場
#   下注前一定用「現在刷新」按鈕（refresh_now.yml）臨場再刷拿真數字。
# 額度：select 每輪 2 計（pinnacle+1xbet odds-by-tournament），每天 1 次 ＝ 2/天。movement 免費。
# Cron 0 1 * * * UTC（＝台灣 09:00，起床有候選清單）。內部 UTC、程式轉 UTC+8。
# 一鍵回退：cron 改回 0 */6 * * * 即回「每 6h 安全網」現狀。
on:
  schedule:
    - cron: "0 1 * * *"   # 每日一次篩選；台灣 09:00
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: write          # 需寫回 repo（commit & push 走勢/錨點）

concurrency:
  group: main_pipeline     # 避免兩次排程同時 push 衝突
  cancel-in-progress: false

jobs:
  movement:
    runs-on: ubuntu-latest
    env:
      # 雙軌金鑰：CI 讀 GitHub Secrets（命名與本機 .env 同名）
      ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # analyzer 用；缺則 ai.available=False（不阻斷）
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TEST_MODE: "false"   # CI 為正式環境，寫 data/prod/
    steps:
      - name: Checkout
        uses: actions/checkout@v6   # node24（GitHub 自 2026/6/16 起強制）

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run movement scan
        run: python -m soccer_ai.main --mode movement

      - name: Run select (每日篩選：選注→analyzer→存推薦→Discord + 觀察場)
        run: python -m soccer_ai.main --mode select

      # 六月 austerity：daily 篩選**不跑 backtest**（省 ~2-3/天額度）；只在手動 dispatch 時跑
      # （要結算某日賽果再手動，或七月 quota 重置後加回 daily）。backtest 預設回填前一日。
      - name: Run backtest backfill (僅手動觸發；六月 daily 不跑省額度)
        if: github.event_name == 'workflow_dispatch'
        run: python -m soccer_ai.main --mode backtest

      - name: Commit & push data
        if: always()   # select 中途失敗時，已原子落地的 data/prod 仍 push、不丟資料
        run: |
          git config user.name  "soccer-ai-bot"
          git config user.email "soccer-ai-bot@users.noreply.github.com"
          git add data/prod/
          if git diff --cached --quiet; then
            echo "無資料變更，略過 commit"
          else
            git commit -m "data(daily-screen): movement+select $(date -u +'%Y-%m-%dT%H:%MZ')"
            # P1：驗證期間與 event_pipeline 並行 push 會撞 race；pull --rebase 後重試（雙向防護）。
            ok=0
            for i in 1 2 3; do
              git pull --rebase origin main && git push && { ok=1; break; }
              echo "push 第 $i 次失敗（疑與 event_pipeline 撞），3s 後重試"; sleep 3
            done
            [ "$ok" = "1" ] || { echo "::error::push 連 3 次失敗"; exit 1; }
          fi
