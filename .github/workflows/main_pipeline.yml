name: main_pipeline

# 架構 A（OddsPapi）：historical 為賽前即時走勢，不需 15 分搶窗。
# Cron 每 3h（止血：select 每輪燒 2 計額度，免費層 250/月扛不住每小時；時段守衛在密集小組賽
#   幾乎不跳，故降頻買時間。代價＝推薦新鮮度降，暫時接受。正解待 event_pipeline 真實驗證後切換）。
# 內部 UTC，程式邏輯轉 UTC+8。跑完將 data/prod/ 變更 commit & push 回 Repo（狀態持久化）。
on:
  schedule:
    - cron: "0 */6 * * *"   # 驗證期間降到每 6h（event_pipeline 並行驗證，main 當安全網，省六月額度；驗證後再評估）
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: write          # 需寫回 repo（commit & push 走勢/錨點）

concurrency:
  group: main_pipeline     # 避免兩次排程同時 push 衝突
  cancel-in-progress: false

jobs:
  movement:
    runs-on: ubuntu-latest
    env:
      # 雙軌金鑰：CI 讀 GitHub Secrets（命名與本機 .env 同名）
      ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # analyzer 用；缺則 ai.available=False（不阻斷）
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TEST_MODE: "false"   # CI 為正式環境，寫 data/prod/
    steps:
      - name: Checkout
        uses: actions/checkout@v6   # node24（GitHub 自 2026/6/16 起強制）

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run movement scan
        run: python -m soccer_ai.main --mode movement

      - name: Run select (選注→analyzer→存推薦→Discord + 觀察場)
        run: python -m soccer_ai.main --mode select

      # backtest 隔日回填本質一天一次；每小時跑會把昨天的場重複結算、空燒額度。
      # → 只在固定 UTC 06:00（=UTC+8 14:00，昨天賽事早已結算、流量低）跑；手動觸發時一律跑（供驗收）。
      - name: Run backtest backfill (隔日賽果回填 + CLV，一天一次)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "06" ]; then
            python -m soccer_ai.main --mode backtest
          else
            echo "非回測時段（$(date -u +%H):00 UTC），略過 backtest（每日 06:00 UTC 跑）"
          fi

      - name: Commit & push data
        if: always()   # select 中途失敗時，已原子落地的 data/prod 仍 push、不丟資料
        run: |
          git config user.name  "soccer-ai-bot"
          git config user.email "soccer-ai-bot@users.noreply.github.com"
          git add data/prod/
          if git diff --cached --quiet; then
            echo "無資料變更，略過 commit"
          else
            git commit -m "data(pipeline): movement+select+backtest $(date -u +'%Y-%m-%dT%H:%MZ')"
            # P1：驗證期間與 event_pipeline 並行 push 會撞 race；pull --rebase 後重試（雙向防護）。
            ok=0
            for i in 1 2 3; do
              git pull --rebase origin main && git push && { ok=1; break; }
              echo "push 第 $i 次失敗（疑與 event_pipeline 撞），3s 後重試"; sleep 3
            done
            [ "$ok" = "1" ] || { echo "::error::push 連 3 次失敗"; exit 1; }
          fi
