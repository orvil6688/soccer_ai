name: event_pipeline

# 逐場事件驅動排程（tick）：每 30 分跑一次，但**只處理「落在自己錨點窗內」的場**（非全掃 104 場）。
# 每場在自己 t30m（開賽前 30 分）那輪觸發 movement 抓取 + select；GH 延遲/跳過時下一輪 catch-up（historical 回整條序列）。
#
# ⚠️ 與 main_pipeline.yml（每小時全掃）**並行、不取代**：揭幕戰前驗收（t30m 模擬 + 回退測試）通過後，
#    總司令才決定是否把 main_pipeline 的 cron 停掉、正式切到本工作。在那之前 main_pipeline 是安全網。
on:
  # 🧪 真實環境驗證窗（2026-06-14 開，限約 1 天）：與 main_pipeline（每 6h 安全網）並行跑，
  #    收 tick_state/movement/額度證據出報告;報告通過才正式切（停 main cron）、沒過就重新註解掉此 schedule 回現狀。
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # 寫回 data/prod（走勢/錨點 + tick_state/fixtures_cache）

concurrency:
  group: event_pipeline    # 與 main_pipeline 不同 group → 兩者可並行
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
      TEST_MODE: "false"   # 正式環境，寫 data/prod/
    steps:
      - name: Checkout
        uses: actions/checkout@v6   # node24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tick（逐場事件驅動：t30m 觸發 movement+select）
        run: python -m soccer_ai.main --mode tick

      - name: Commit & push（含 tick_state / fixtures_cache）
        if: always()   # tick 中途失敗時，已落地的 data/prod（含 tick_state）仍持久化
        run: |
          git config user.name  "soccer-ai-bot"
          git config user.email "soccer-ai-bot@users.noreply.github.com"
          git add data/prod/
          if git diff --cached --quiet; then
            echo "無變更，略過 commit"
          else
            git commit -m "data(tick): event-driven capture $(date -u +'%Y-%m-%dT%H:%MZ')"
            # P1：與 main_pipeline 並行時 push 會撞 race；pull --rebase 後重試，
            #     否則 push 失敗 → tick_state 不持久化 → select_done 丟失 → 下輪重複 select 爆額度。
            #     data 檔與 main 多為不相交（各寫各的），rebase 通常無衝突。
            ok=0
            for i in 1 2 3; do
              git pull --rebase origin main && git push && { ok=1; break; }
              echo "push 第 $i 次失敗（疑與 main_pipeline 撞），3s 後重試"; sleep 3
            done
            [ "$ok" = "1" ] || { echo "::error::push 連 3 次失敗，tick_state 未持久化"; exit 1; }
          fi
